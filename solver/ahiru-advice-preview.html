<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あひる先生・表示試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1F2937;color:#edf0f8;font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}.preview{max-width:390px;margin:auto;padding:16px 12px}h1{font-size:19px;margin:0 0 4px}.note{font-size:12px;color:#afb8cf;margin:0 0 16px}.example{border:1px solid #3c455d;border-radius:14px;background:#22283a;padding:12px;margin:0 0 14px}.caption{font-size:11px;color:#c0c7d8;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}.stat{padding:4px;border-radius:6px;background:#2d354b;font-size:11px}.stat strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}.advice{display:flex;align-items:center;gap:9px;min-height:52px;padding:4px 0;margin:6px 0}.face{flex:0 0 44px;width:44px;height:44px;padding:0;border:0;border-radius:13px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.face:focus-visible{outline:3px solid #b9cfff;outline-offset:3px}.face img{display:block;width:44px;height:44px}.bubble{position:relative;min-width:0;flex:1;padding:7px 9px;border-radius:12px;font-size:13px;line-height:1.5;overflow-wrap:anywhere;color:#f2f5ff;border:1px solid #57637f;background:#30394f}.bubble::before{content:"";position:absolute;left:-5px;top:50%;width:8px;height:8px;transform:translateY(-50%) rotate(45deg);background:#30394f;border-left:1px solid #57637f;border-bottom:1px solid #57637f}.action{width:100%;min-height:40px;border:0;border-radius:8px;background:#536cb5;color:white;font:inherit}.face[aria-expanded=false]+.bubble{display:none}[hidden]{display:none!important}
</style><main class="preview"><h1>あひる先生</h1><p class="note">表示だけの試作。セリフは仮の例です。<br>顔をタップすると、その行に吹き出しが開きます。</p>
<section class="example" data-tone="red"><div class="caption">不足の表示例 · カード取得</div><div class="stats"><div class="stat">体験<strong>20</strong></div><div class="stat">入塾<strong>15</strong></div><div class="stat">満足<strong>20</strong></div><div class="stat">経理<strong>18</strong></div></div><div class="advice"><button class="face" type="button" aria-label="心配：あひる先生のアドバイスを開く" aria-expanded="false" aria-controls="speech-red"><img src="../game/data/ahiru/worried.svg" alt=""></button><div class="bubble" id="speech-red" role="status" hidden>体験が不足気味。動員を補強しよう</div></div><button class="action" type="button">習得を確定</button></section>
<section class="example" data-tone="yellow"><div class="caption">余裕の表示例 · カード削除</div><div class="stats"><div class="stat">体験<strong>45</strong></div><div class="stat">入塾<strong>40</strong></div><div class="stat">満足<strong>22</strong></div><div class="stat">経理<strong>28</strong></div></div><div class="advice"><button class="face" type="button" aria-label="気づき：あひる先生のアドバイスを開く" aria-expanded="false" aria-controls="speech-yellow"><img src="../game/data/ahiru/notice.svg" alt=""></button><div class="bubble" id="speech-yellow" role="status" hidden>経理は十分。庶務を減らせそうだよ</div></div><button class="action" type="button">削除を確定</button></section>
<section class="example" data-tone="green"><div class="caption">順調の表示例 · カード取得</div><div class="stats"><div class="stat">体験<strong>50</strong></div><div class="stat">入塾<strong>40</strong></div><div class="stat">満足<strong>25</strong></div><div class="stat">経理<strong>17</strong></div></div><div class="advice"><button class="face" type="button" aria-label="笑顔：あひる先生のアドバイスを開く" aria-expanded="false" aria-controls="speech-green"><img src="../game/data/ahiru/happy.svg" alt=""></button><div class="bubble" id="speech-green" role="status" hidden>順調だよ。入塾をさらに伸ばそう</div></div><button class="action" type="button">習得を確定</button></section>
</main><script>for(const button of document.querySelectorAll('.face'))button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',button.getAttribute('aria-label').replace(/開く|閉じる/,open?'閉じる':'開く'));document.getElementById(button.getAttribute('aria-controls')).hidden=!open;});</script></html>
