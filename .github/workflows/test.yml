name: Test common game foundation
on:
  pull_request:
  push:
    branches: [main, 'codex/shared-*']
permissions:
  contents: read
jobs:
  test:
    # Playwrightの固定版が対応するOSを使い、latestの切替で検査を止めない。
    runs-on: ubuntu-24.04
    # 全モードの対戦完走・固定CPU・リプレイ視聴とWebKitの回帰検証時間を確保する
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
